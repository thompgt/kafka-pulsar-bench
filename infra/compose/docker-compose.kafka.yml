# Kafka under test: single broker, KRaft combined mode.
#
# Single-node is a deliberate scope limit (BRD 4.2), not an oversight. It keeps
# the comparison against single-node Pulsar honest and fits the memory budget.
#
# This container is destroyed and recreated between runs, volume included
# (invariant 4). Nothing here may hold state that should survive a run.

name: kpbench

networks:
  kpbench:
    name: kpbench

volumes:
  kafka_data:
    name: kpbench_kafka_data

services:
  kafka:
    image: ${KAFKA_IMAGE}:${KAFKA_VERSION}
    container_name: kpbench-kafka
    hostname: kafka
    networks: [kpbench]
    ports:
      # 9092 is the in-network listener; 29092 is how the harness reaches it
      # from the host. Two listeners, because advertised addresses differ.
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-kpbench-kafka-cluster}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Single node, so every replication factor must be 1 or topic creation
      # blocks forever waiting for replicas that will never exist.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # The harness creates topics explicitly with a configured partition count.
      # Auto-creation would silently produce a 1-partition topic and quietly
      # invalidate any run that meant to test partition scaling.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # --- Benchmark-relevant tuning ------------------------------------
      # Documented and held constant across runs unless the run config varies
      # them. Every value here needs a counterpart in the Pulsar equivalence
      # table (M-7); do not change one side alone.
      KAFKA_NUM_NETWORK_THREADS: ${KAFKA_NUM_NETWORK_THREADS:-3}
      KAFKA_NUM_IO_THREADS: ${KAFKA_NUM_IO_THREADS:-8}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_MS: ${KAFKA_LOG_RETENTION_MS:-3600000}
      # Kafka's default is to never fsync explicitly and rely on the page
      # cache. Left at the default deliberately; the Pulsar side documents
      # that BookKeeper journals by default, and that asymmetry is called out
      # in the equivalence table rather than papered over.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx1G -Xms1G}
    volumes:
      - kafka_data:/var/lib/kafka/data
    cpus: ${KAFKA_CPUS:-2.0}
    mem_limit: ${KAFKA_MEM:-2g}
    healthcheck:
      # Ready means "answers the admin API", not "process started".
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
